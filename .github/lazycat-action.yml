version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/godoos.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: godoos
    bump: patch

build:
  run_buildscript: false

images:
  - id: godoos
    target: service
    service: godoos
    source: godoos/godoos
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: GodoOS
    summary: "一款高效的内网办公操作系统"
